# ============ GPU SPECIFIC SETTINGS ============
gpu:
  enabled: true
  device_id: 0
  memory_growth: true               # Allow memory growth
  per_process_gpu_memory_fraction: 0.8
  
  # CUDA optimization
  cuda_optimizations:
    allow_tensor_core: true
    enable_cudnn_autotune: true
    cudnn_benchmark: true
  
  # Multi-GPU (if you add more GPUs)
  multi_gpu: false
  gpu_devices: [0]

# ============ MEMORY MANAGEMENT ============
memory:
  preallocate: false                # Don't preallocate all GPU memory
  allow_growth: true                # Allow memory growth
  max_allocated_gb: 48              # Max 48GB RAM for data (leave 16GB for system)
  swap_if_needed: false
  
  # Data loading
  prefetch_buffer: 10               # Prefetch 10 batches
  num_parallel_calls: 8             # Parallel data loading

# ============ LOGGING AND DEBUGGING ============
logging:
  level: "INFO"
  enable_profiling: true
  profile_batch_range: [10, 20]     # Profile batches 10-20
  
  # TensorBoard
  tensorboard:
    enabled: true
    log_dir: "logs/tensorboard"
    update_freq: "batch"
    
  # MLflow integration
  mlflow:
    enabled: true
    tracking_uri: "http://localhost:5000"
    experiment_name: "chainguardian_ai"