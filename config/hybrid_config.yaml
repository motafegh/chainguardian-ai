# ============ HYPERPARAMETER TUNING ============
hyperparameter_tuning:
  enable_optuna: true
  n_trials: 200                     # Increased from 50 - use more of your RAM
  timeout_seconds: 7200             # Increased from 3600
  direction: maximize
  study_name: "chainguardian_optimization_v2"
  n_jobs: -1                        # Use all CPU cores
  gpu_id: 0                         # Use GPU if available
  
  # GPU-accelerated models (if you install GPU versions)
  gpu_acceleration:
    xgboost_gpu: true
    lightgbm_gpu: true
  
  # Expanded search spaces with more values
  search_spaces:
    xgboost:
      n_estimators: [100, 500]      # Increased upper bound
      max_depth: [3, 12]            # Deeper trees possible
      learning_rate: [0.005, 0.3]   # Wider range
      subsample: [0.5, 1.0]
      colsample_bytree: [0.5, 1.0]
      gamma: [0, 10]
      reg_alpha: [0, 20]
      reg_lambda: [0.1, 20]
      tree_method: ["hist", "gpu_hist"]  # GPU option
      predictor: ["gpu_predictor"]       # GPU prediction
    
    random_forest:
      n_estimators: [100, 500]      # More estimators
      max_depth: [5, 30]            # Much deeper
      min_samples_split: [2, 20]
      min_samples_leaf: [1, 10]
      n_jobs: -1                    # Parallel processing
      max_features: [0.3, 1.0]
    
    lightgbm:
      n_estimators: [100, 500]
      num_leaves: [20, 200]         # Increased for more complex patterns
      learning_rate: [0.005, 0.3]
      feature_fraction: [0.5, 1.0]
      bagging_fraction: [0.5, 1.0]
      bagging_freq: [1, 10]
      device: ["gpu"]               # GPU acceleration
      gpu_platform_id: 0
      gpu_device_id: 0

# ============ ENSEMBLE CONFIGURATION ============
ensemble:
  enabled: true
  voting_method: "soft"
  use_gpu: true                     # Enable GPU for ensemble
  batch_size: 1024                  # Larger batch for GPU
  
  # More sophisticated weight optimization
  weight_optimization:
    method: "genetic_algorithm"     # Options: grid_search, bayesian, genetic
    population_size: 50             # For genetic algorithm
    generations: 100
    n_folds: 5                      # More folds for stable weights
  
  initial_weights:
    xgboost: 0.4
    random_forest: 0.3
    lightgbm: 0.2
    logistic_regression: 0.1
  
  calibration_method: "isotonic"
            # Back to isotonic with more data
  
  # Enhanced uncertainty quantification
  uncertainty:
    enable_bootstrap: true
    n_bootstrap_samples: 1000       # Increased from 100
    confidence_level: 0.95
    method: "bayesian"              # More sophisticated uncertainty
    mc_dropout_samples: 100         # For neural networks if added

# ============ DATA AUGMENTATION ============
augmentation:
  enabled: true
  strategy: "mixed"                 # Combined strategies
  mixup_alpha: 0.4                  # Increased alpha
  gaussian_std: 0.1                 # Increased noise
  smote_neighbors: 10               # More neighbors for SMOTE
  max_augmentation_factor: 4.0      # Increased from 2.0 - generate 4x data
  
  # Progressive augmentation
  progressive_augmentation: true
  epochs: 3                         # Multiple augmentation rounds
  quality_filter: true              # Filter low-quality synthetic samples

# ============ BATCH PROCESSING ============
batch_processing:
  enabled: true
  batch_size: 512                   # Increased from 32 - better GPU utilization
  max_workers: 8                    # Increased from 4 - use more CPU cores
  enable_vectorization: true
  use_gpu_batches: true             # GPU batch processing
  
  # Memory optimization
  preload_data: true                # Preload all data to RAM
  cache_size_gb: 16                 # Cache 16GB of data
  chunk_size: 10000                 # Process in larger chunks

# ============ MODEL REGISTRY ============
model_registry:
  registry_path: "models/registry"
  keep_last_n_versions: 20          # Keep more versions
  auto_versioning: true
  enable_experiment_tracking: true
  
  # Advanced metadata
  metadata_schema:
    - model_type
    - performance_metrics
    - training_date
    - feature_list
    - hyperparameters
    - hardware_used
    - training_time
    - data_statistics
  
  # GPU-specific info
  gpu_metadata:
    track_gpu_metrics: true
    memory_usage: true
    inference_speed: true

# ============ MONITORING ============
monitoring:
  enable_performance_logging: true
  log_dir: "logs"
  realtime_metrics: true
  enable_tensorboard: true          # TensorBoard integration
  
  metrics_to_track:
    - accuracy
    - auc
    - precision
    - recall
    - f1_score
    - inference_latency
    - gpu_memory_usage
    - cpu_utilization
    - data_quality_scores
  
  drift_detection:
    enabled: true
    window_size: 5000               # Increased from 1000
    drift_threshold: 0.03           # More sensitive
    check_interval: 1000            # Check every 1000 predictions
    methods: ["ks_test", "mmd", "classifier"]  # Multiple methods

# ============ FEATURE ENGINEERING ============
features:
  preserve_all_engineered: true
  
  # # Enable advanced feature engineering
  # polynomial_features: true         # Generate polynomial features
  # interaction_features: true        # Generate interaction terms
  # degree: 2                         # Degree for polynomial features
  
  # # Feature selection
  # feature_selection:
  #   method: "mutual_info"           # Options: mutual_info, chi2, rf_importance
  #   n_features_to_select: 100       # Select top N features
  #   threshold: 0.01
  
  boolean_features: "has_*"
  continuous_features: "*_count,*_ratio,*_score,*_length,*_depth"
  categorical_features: "none"
  
  scaler_type: "robust"

# ============ THRESHOLDS ============
thresholds:
  vulnerability_prediction: 0.15    # More sensitive threshold
  high_confidence: 0.90             # Higher bar for high confidence
  low_confidence: 0.30              # Lower bar for low confidence
  override_cei_violations: 2        # More sensitive override
  override_perfect_cei_with_guard: true
  
  # Adaptive thresholds
  adaptive_thresholds: true
  threshold_smoothing: 0.1          # Smooth threshold changes

# ============ PERFORMANCE OPTIMIZATION ============
performance:
  enable_feature_caching: true
  cache_size: 10000                 # Increased from 1000
  prediction_timeout_ms: 10000      # Increased timeout for complex models
  memory_limit_mb: 32768            # Increased to 32GB (half of your RAM)
  
  # GPU optimization
  gpu_memory_fraction: 0.8          # Use 80% of GPU memory
  enable_mixed_precision: true      # Use FP16 for faster inference
  gpu_batch_size: 2048              # Larger GPU batches
  
  # Parallel processing
  parallel_feature_extraction: true
  n_feature_workers: 4
  
  # Model optimization
  enable_model_pruning: true
  enable_quantization: true         # Quantize models for faster inference

