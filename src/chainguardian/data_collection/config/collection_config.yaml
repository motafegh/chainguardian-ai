# Dataset Collection Configuration
# Version: 1.0
# Purpose: Reproducible, stratified contract sampling

dataset:
  target_size: 100
  min_size: 50
  
sampling_strategy:
  strata:
    - name: "high_quality"
      percentage: 30
      criteria:
        - top_by_tvl: 30
        - min_transactions: 10000
        
    - name: "random_verified"
      percentage: 40
      criteria:
        - random_sample: true
        - verified: true
        - date_range: ["2020-01-01", "2024-12-31"]
        
    - name: "known_vulnerable"
      percentage: 20
      criteria:
        - from_database: "rekt_news"
        - severity: ["high", "critical"]
        
    - name: "version_diversity"
      percentage: 10
      criteria:
        - solidity_version: ["0.4.x", "0.5.x"]
        - date_range: ["2016-01-01", "2019-12-31"]

filters:
  exclude:
    - unverified: true
    - too_simple: 
        max_functions: 2
    - duplicates: true
    
output:
  format: "csv"
  path: "data/collected_dataset.csv"
  metadata: true
