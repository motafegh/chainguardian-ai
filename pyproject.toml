[tool.poetry]
name = "chainguardian-ai"
version = "0.1.0"
description = "AI-powered smart contract auditing platform"
authors = ["Ali rj <you@example.com>"]
license = "MIT"
readme = "README.md"

# Safe packages configuration - minimal change
packages = [
    { include = "chainguardian", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# Core AI/ML Stack (from shared venv)
torch = "^2.9.1"
transformers = "^4.57.3"
sentence-transformers = "^5.1.2"
faiss-cpu = "^1.13.1"

# LangChain Ecosystem
langchain = "^0.3.27"
langchain-community = "^0.3.31"
langchain-ollama = "^0.2.3"
langchain-core = "^0.3.80"
langchain-text-splitters = "^0.3.11"

# Web Framework
fastapi = "^0.124.2"
uvicorn = { extras = ["standard"], version = "^0.38.0" }
pydantic = "^2.12.5"
pydantic-settings = "^2.12.0"

# Blockchain Tools
web3 = "^7.14.0"
slither-analyzer = "^0.10.0"
eth-account = "^0.13.7"
hexbytes = "^1.3.1"

# Utilities
python-dotenv = "^1.2.1"
requests = "^2.32.5"
pyyaml = "^6.0.3"
aiohttp = "^3.13.2"
pandas = "^2.3.3"
tqdm = "^4.67.1"
solc-select = "^1.2.0"
xgboost = "^3.1.2"
matplotlib = "^3.10.8"
seaborn = "^0.13.2"
joblib = "^1.5.2"
scikit-learn = ">=1.3.0,<1.6.0"
imbalanced-learn = ">=0.12.0"
psycopg2-binary = "^2.9.11"
sqlalchemy = "^2.0.45"
redis = "^7.1.0"
jupyter = "^1.1.1"
ipykernel = "^7.1.0"
scipy = "^1.16.3"
networkx = "^3.6.1"
lightgbm = "^4.6.0"
shap = "^0.50.0"
optuna = "^4.6.0"
h2o = "^3.46.0.9"
sweetviz = "^2.3.1"
dill = "^0.4.0"
mlflow = "^3.7.0"
prometheus-fastapi-instrumentator = "^7.1.0"
python-json-logger = "^4.0.0"
evidently = "^0.7.18"
plotly = ">=5.10.0,<6"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^0.23.0"
black = "^25.12.0"
httpx = "^0.28.1"
gpustat = "^1.1.1"
mypy = "^1.19.1"
types-pyyaml = "^6.0.12.20250915"
ruff = "^0.14.10"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# MyPy configuration - ADD THIS SECTION
[tool.mypy]
python_version = "3.11"

# Critical: Disable cache to avoid duplicate module detection
cache_dir = "/dev/null"

# Safe path configuration
mypy_path = "src"

# Type checking settings (non-breaking)
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Keep as false to avoid breaking existing code
disallow_incomplete_defs = false  # Keep as false
ignore_missing_imports = true  # Keep as true to avoid import errors

# Package discovery
namespace_packages = true
explicit_package_bases = true

# Exclude patterns (safe)
exclude = [
    "^tests/",
    "^scripts/",
    "^docs/",
    "^build/",
    "^dist/",
    "^\\.venv/",
    "^\\.mypy_cache/",
]

# Plugin for pydantic (if you use it)
plugins = [
    "pydantic.mypy",
]

# Keep existing pytest configuration unchanged
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --import-mode=importlib"
log_cli = true
log_cli_level = "INFO"

# Keep existing black configuration unchanged
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'