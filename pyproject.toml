[tool.poetry]
name = "chainguardian-ai"
version = "0.1.0"
description = "AI-powered smart contract auditing platform"
authors = ["Ali rj <you@example.com>"]
license = "MIT"
readme = "README.md"

packages = [
    { include = "chainguardian", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# Core AI/ML Stack (from shared venv)
torch = "^2.9.1"
transformers = "^4.57.3"
sentence-transformers = "^5.1.2"
faiss-cpu = "^1.13.1"

# LangChain Ecosystem
langchain = "^0.3.27"
langchain-community = "^0.3.31"
langchain-ollama = "^0.2.3"
langchain-core = "^0.3.80"
langchain-text-splitters = "^0.3.11"

# Web Framework
fastapi = "^0.124.2"
uvicorn = { extras = ["standard"], version = "^0.38.0" }
pydantic = "^2.12.5"
pydantic-settings = "^2.12.0"

# Blockchain Tools
web3 = "^7.14.0"
slither-analyzer = "^0.10.0"
eth-account = "^0.13.7"
hexbytes = "^1.3.1"

# Utilities
python-dotenv = "^1.2.1"
requests = "^2.32.5"
pyyaml = "^6.0.3"
aiohttp = "^3.13.2"
pandas = "^2.3.3"
tqdm = "^4.67.1"
solc-select = "^1.2.0"
xgboost = "^3.1.2"
matplotlib = "^3.10.8"
seaborn = "^0.13.2"
joblib = "^1.5.2"
scikit-learn = ">=1.3.0,<1.6.0"
imbalanced-learn = ">=0.12.0"
psycopg2-binary = "^2.9.11"
sqlalchemy = "^2.0.45"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^0.23.0"
black = "^25.12.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --import-mode=importlib"
log_cli = true
log_cli_level = "INFO"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
