global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'chainguardian'

# Alert manager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "/etc/prometheus/rules.yml"

# Scrape configuration
scrape_configs:
  - job_name: 'chainguardian-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
  
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
    # Uncomment if using node-exporter
    # - job_name: 'cadvisor'
    #   static_configs:
    #     - targets: ['cadvisor:8080']