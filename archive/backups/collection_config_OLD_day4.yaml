# src/chainguardian/data_collection/config/collection_config.yaml

# Dataset Collection Configuration
# Version: 5.0 (Optimized)
# Purpose: Reproducible, stratified contract sampling with parallel processing

dataset:
  target_size: 500
  min_size: 300

# Parallel processing settings
parallel:
  scraping_workers: 5  # Number of concurrent API requests
  analysis_workers: 4   # Number of processes for feature extraction (CPU-bound)

# Caching settings
cache:
  enabled: true
  etherscan_cache_dir: "cache/etherscan"
  feature_cache_dir: "cache/features"
  clear_cache: false  # Set to true to clear cache on next run

sampling_strategy:
  strata:
    # High-quality DeFi protocols (20%)
    - name: "high_quality"
      percentage: 20
      criteria:
        - top_by_tvl: 300
        - min_transactions: 5000
        
    # Known tokens (25%)
    - name: "known_tokens"
      percentage: 25
      criteria:
        - count: 150
        
    # Known vulnerable contracts (15%)
    - name: "known_vulnerable"
      percentage: 15
      criteria:
        - from_database: "rekt_news"
        - severity: ["high", "critical", "medium"]
        
    # Version diversity (10%)
    - name: "version_diversity"
      percentage: 10
      criteria:
        - solidity_version: ["0.4.x", "0.5.x", "0.6.x"]
        - date_range: ["2016-01-01", "2020-12-31"]
    
    # DEX liquidity pools (10%)
    - name: "dex_pools"
      percentage: 10
      criteria:
        - min_liquidity: 10000
    
    # NFT projects (5%)
    - name: "nft_projects"
      percentage: 5
      criteria:
        - source: "opensea_top"
        - min_floor_price: 0.001
    
    # GitHub contracts (5%)
    - name: "github_contracts"
      percentage: 5
      criteria:
        - count: 30
    
    # Arbitrum contracts (5%)
    - name: "arbitrum_contracts"
      percentage: 5
      criteria:
        - count: 30
    
    # Polygon contracts (5%)
    - name: "polygon_contracts"
      percentage: 5
      criteria:
        - count: 30

filters:
  exclude:
    - unverified: false       # DISABLE for now
    - too_simple: 
        max_functions: 0      # Set to 0 (keep all)
    - duplicates: true        # Keep this one
    
output:
  format: "csv"
  path: "data/collected_dataset.csv"
  metadata: true