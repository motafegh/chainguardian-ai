name: ChainGuardian CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ================================================================
  # JOB 1: CODE QUALITY (Minimal install - only ruff!)
  # ================================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: �� Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 🔍 Install ruff only (fast!)
        run: |
          pip install ruff==0.1.9
      
      - name: 🔍 Lint with Ruff
        run: |
          ruff check src/chainguardian/
        continue-on-error: false

  # ================================================================
  # JOB 2: BUILD DOCKER IMAGE (Docker handles dependencies)
  # ================================================================
  build:
    name: Build & Test Docker
    needs: quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🏗️ Build Docker image
        run: |
          docker build \
            -t chainguardian-api:${{ github.sha }} \
            -t chainguardian-api:latest \
            .
      
      - name: 🧪 Test Docker image
        run: |
          # Start container
          docker run -d \
            -p 8000:8000 \
            --name test-api \
            chainguardian-api:latest
          
          echo "⏳ Waiting 60 seconds for model loading..."
          sleep 60
          
          # Test health endpoint
          echo "Testing /health..."
          curl -f http://localhost:8000/health || exit 1
          
          # Test root endpoint
          echo "Testing /..."
          curl -f http://localhost:8000/ || exit 1
          
          # Check logs for successful model loading
          echo "Checking model loading..."
          docker logs test-api | grep "Predictor loaded" || exit 1
          
          echo "✅ All smoke tests passed!"
          
          # Cleanup
          docker stop test-api
          docker rm test-api
      
      - name: 📊 Image size check
        run: |
          SIZE=$(docker images chainguardian-api:latest --format "{{.Size}}")
          echo "📦 Docker image size: $SIZE"

  # ================================================================
  # JOB 3: DEPLOY TO RAILWAY (only on main)
  # ================================================================
  deploy:
    name: Deploy to Railway
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🚂 Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: 🚀 Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "⚠️ RAILWAY_TOKEN not set, skipping deployment"
            exit 0
          fi
          
          railway up --service chainguardian-api
          echo "✅ Deployed to Railway!"
      
      - name: ⏳ Wait for deployment
        run: sleep 60
      
      - name: 🔍 Smoke test production
        run: |
          RAILWAY_URL="${{ secrets.RAILWAY_URL }}"
          
          if [ -z "$RAILWAY_URL" ]; then
            echo "⚠️ RAILWAY_URL not set, skipping smoke test"
            exit 0
          fi
          
          echo "Testing: $RAILWAY_URL"
          curl -f "$RAILWAY_URL/health" || exit 1
          echo "✅ Production healthy!"
