version: '3.8'

services:
  api:
    image: chainguardian-api:latest
    container_name: chainguardian-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://chainguardian:chainguardian123@postgres:5432/chainguardian
      REDIS_URL: redis://redis:6379/0
      API_ENV: development
      LOG_LEVEL: INFO
      OLLAMA_HOST: http://ollama:11434
      ENABLE_METRICS: "true"
      
    volumes:
      - ./config/models:/app/models:ro
      - ./logs:/app/logs
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_healthy
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: chainguardian-postgres
    environment:
      POSTGRES_USER: chainguardian
      POSTGRES_PASSWORD: chainguardian123
      POSTGRES_DB: chainguardian
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainguardian"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chainguardian-redis
    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data
    
    command: redis-server --appendonly yes
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: chainguardian-ollama
    ports:
      - "11434:11434"
    
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "2"
    
    volumes:
      - ollama-data:/root/.ollama
      - /dev/shm:/dev/shm  # For better performance
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped
    
    # GPU support (uncomment if you have NVIDIA GPU)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Extra time for model downloads

  prometheus:
    image: prom/prometheus:latest
    container_name: chainguardian-prometheus
    ports:
      - "9090:9090"  # UNCOMMENTED for monitoring
    
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      - ./config/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: chainguardian-grafana
    ports:
      - "3000:3000"  # UNCOMMENTED for dashboard access
    
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: "grafana-piechart-panel,grafana-worldmap-panel"
      GF_FEATURE_TOGGLES_ENABLE: "publicDashboards"
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    
    depends_on:
      prometheus:
        condition: service_healthy
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  chainguardian-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  prometheus-data:
  grafana-data: