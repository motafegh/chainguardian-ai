# docker-compose.yml
# NO version field (obsolete in modern Docker Compose)

services:
  api:
    image: chainguardian-api:latest
    container_name: chainguardian-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://chainguardian:chainguardian123@postgres:5432/chainguardian
      REDIS_URL: redis://redis:6379/0
      API_ENV: development
      LOG_LEVEL: INFO
      
    volumes:
      - ./config/models:/app/models:ro
      - ./logs:/app/logs
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  postgres:
    image: postgres:16-alpine
    container_name: chainguardian-postgres
    environment:
      POSTGRES_USER: chainguardian
      POSTGRES_PASSWORD: chainguardian123
      POSTGRES_DB: chainguardian
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainguardian"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: chainguardian-redis
    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data
    
    command: redis-server --appendonly yes
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  prometheus:
    image: prom/prometheus:latest
    container_name: chainguardian-prometheus
    # NO PORT EXPOSURE - access via Docker network only
    # ports:
    #   - "9090:9090"  # COMMENTED OUT to avoid WSL2 port conflict
    
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3


  grafana:
    image: grafana/grafana:latest
    container_name: chainguardian-grafana
    # NO PORT EXPOSURE - access via Docker network only
    # ports:
    #   - "3000:3000"  # COMMENTED OUT to avoid WSL2 port conflict
    
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: ""
    
    volumes:
      - grafana-data:/var/lib/grafana
      # Optional: Pre-provision dashboards
      # - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    
    depends_on:
      prometheus:
        condition: service_healthy
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3


networks:
  chainguardian-network:
    driver: bridge


volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
