version: '3.8'

services:
  api:
    image: chainguardian-api:latest
    container_name: chainguardian-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://chainguardian:chainguardian123@postgres:5432/chainguardian
      REDIS_URL: redis://redis:6379/0
      API_ENV: development
      LOG_LEVEL: INFO
      
    volumes:
      # FIX: Mount config/models (where your models actually are)
      - ./config/models:/app/models:ro
      - ./logs:/app/logs
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: chainguardian-postgres
    environment:
      POSTGRES_USER: chainguardian
      POSTGRES_PASSWORD: chainguardian123
      POSTGRES_DB: chainguardian
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainguardian"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chainguardian-redis
    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data
    
    command: redis-server --appendonly yes
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: chainguardian-prometheus
    ports:
      - "9090:9090"
    
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: chainguardian-grafana
    ports:
      - "3000:3000"
    
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    
    volumes:
      - grafana-data:/var/lib/grafana
    
    depends_on:
      - prometheus
    
    networks:
      - chainguardian-network
    
    restart: unless-stopped

networks:
  chainguardian-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
